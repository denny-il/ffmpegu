name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        runtime: [node, bun]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        with:
          runtime: node@24
          install: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - name: Install FFmpeg
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update && sudo apt-get install -y ffmpeg
          else
            brew install ffmpeg
          fi
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - run: pnpm run test:${{ matrix.runtime }} --coverage
      - name: Compare descriptor handling on Node
        if: failure() && matrix.os == 'macos-latest' && matrix.runtime == 'bun'
        timeout-minutes: 5
        run: node scripts/diagnose-extra-fds.mjs --trials 20 --ffmpeg "$(command -v ffmpeg)"
      - name: Diagnose macOS Bun descriptor failures
        if: failure() && matrix.os == 'macos-latest' && matrix.runtime == 'bun'
        timeout-minutes: 5
        run: bun scripts/diagnose-extra-fds.mjs --trials 20 --ffmpeg "$(command -v ffmpeg)"
      - run: pnpm run test:package
        env:
          FFMPEGU_PACKAGE_RUNTIME: ${{ matrix.runtime }}
